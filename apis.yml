aid: vanilla
name: Vanilla
description: Vanilla (Vanilla Technologies Inc.) is an estate planning platform for
  financial advisors, RIAs, and wealth management firms. The platform provides AI-powered
  estate document analysis and estate health assessments, estate visualization, scenario
  modeling for tax strategies, and estate document creation, letting advisors deliver
  estate planning across clients at all wealth levels. Vanilla is SOC 2 Type II audited
  and integrates with wealth management platforms including Salesforce, Orion, Black
  Diamond, Addepar, eMoney, and Plaid. Backed by Insight Partners. No public developer
  portal or API documentation is published; the api.justvanilla.com host is private.
